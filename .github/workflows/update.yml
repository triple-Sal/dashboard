# ============================================================
#  הרובוט האוטומטי: כל 15 דקות אוסף נתונים ומעלה את האתר מחדש.
#  אפשר גם להפעיל ידנית: לשונית Actions > Update dashboard > Run workflow
# ============================================================
name: Update dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: roy-dashboard              # שם האתר ב-Cloudflare
      CLOUDFLARE_ACCOUNT_ID: ''           # מספר החשבון ב-Cloudflare (לא סודי)
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # הנתונים מהריצה הקודמת, למקרה שמקור כלשהו לא זמין כרגע
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Collect news and market data
        run: node scripts/fetch-data.mjs

      - uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      # מכינים תיקייה נקייה רק עם קבצי האתר
      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html config.js css js data _site/

      # העלאה ל-Cloudflare (האתר המוגן)
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@3 pages deploy _site --project-name="$PROJECT" --branch=main --commit-dirty=true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
