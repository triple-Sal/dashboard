# ============================================================
#  שומר על הרובוט ער: GitHub מכבה רובוטים מתוזמנים בפרויקט
#  שלא היה בו שינוי 60 יום. פעם בחודש נשמר כאן שינוי זעיר.
# ============================================================
name: Keep alive

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep scheduled updates active"
          git push
